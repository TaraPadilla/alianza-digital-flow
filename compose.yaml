services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alianza-f1-landing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    expose:
      - "3000"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
